name: GM Daily Output Compliance (10 AM IST)

# Dedicated, isolated morning refresh for the "GM Daily Output Compliance" report
# (Central Reports -> Core Team). Runs golive (card 7682) then GM compliance (card 2580 +
# Validation sheet), so it stays fresh even if the big nightly refresh fails on another step.
#
# SCHEDULING — do not move this back into the nightly's window.
# Every workflow here shares `concurrency: data-write`, and GitHub keeps only ONE *pending* run
# per group: a newer arrival cancels the older pending one. This job used to run at 02:50 UTC,
# i.e. 20 min AFTER the nightly starts, so it always queued behind a ~45-minute run and was then
# superseded by the next ts_refresh / gc_refresh. It was cancelled 6 days out of 6 (2026-08-05 ->
# 08-10) and had effectively never executed. No data was lost — golive_refresh and
# gm_compliance_refresh also run inside refresh.yml — but this job's own mid-morning refresh
# never happened.
# 04:30 UTC sits after the nightly has finished on its usual timing (it is cron'd for 02:30 but
# GitHub delays it to ~04:10-05:50, then runs ~45 min) and clears the ts_refresh (every 3h on the
# hour) and gc_refresh (:30, every 2h from 03:30) slots.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 4 * * *'   # 10:00 IST — after the nightly finishes, not 20 min after it starts

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  gm-daily:
    runs-on: ubuntu-latest
    env:
      METABASE_URL: ${{ secrets.METABASE_URL }}
      METABASE_USER_EMAIL: ${{ secrets.METABASE_USER_EMAIL }}
      METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}

      METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
      REPO_DIR: ${{ github.workspace }}
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-auth requests

      - name: Golive overview (card 7682)
        run: python pipelines/golive_refresh.py

      - name: GM compliance (card 2580 + Validation sheet, depends on golive)
        run: python pipelines/gm_compliance_refresh.py

      - name: Commit & push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add golive_data.json gm_compliance_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "GM Daily Output refresh (golive + gm_compliance)"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Nv7Bqm9rCMXGjFA018pplRCW
          VERCEL_PROJECT_ID: prj_YddUtFJTQvft3JUAArpDh9wsNr8l
        run: npx --yes vercel@latest --prod --yes --token "$VERCEL_TOKEN"
