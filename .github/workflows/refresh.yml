name: Refresh data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 2 * * *'   # daily 02:30 UTC (08:00 IST)

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      METABASE_URL: ${{ secrets.METABASE_URL }}
      METABASE_USER_EMAIL: ${{ secrets.METABASE_USER_EMAIL }}
      METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}

      METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
      REPO_DIR: ${{ github.workspace }}
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-auth requests

      - name: ARR (output)
        continue-on-error: true
        run: python pipelines/output_refresh.py
      - name: Troubleshoot (ts + hitsMap)
        continue-on-error: true
        run: python pipelines/ts_refresh.py
      - name: Task & Call compliance
        continue-on-error: true
        run: python pipelines/task_refresh.py
      - name: Spend/Live (scaling + google T/S)
        continue-on-error: true
        run: python pipelines/scaling_refresh.py
      - name: Bucket summary
        continue-on-error: true
        run: python pipelines/bucket_refresh.py
      - name: Golive overview
        continue-on-error: true
        run: python pipelines/golive_refresh.py
      - name: HIT 1
        continue-on-error: true
        run: python pipelines/hit1_refresh.py
      - name: HIT 2
        continue-on-error: true
        run: python pipelines/hit2_refresh.py
      - name: Hypercare sellers
        continue-on-error: true
        run: python pipelines/hypercare_refresh.py
      - name: NPS
        continue-on-error: true
        run: python pipelines/nps_refresh.py
      - name: Marketing Ops
        continue-on-error: true
        run: python pipelines/markops_refresh.py
      - name: Bird Eye View (depends on the above)
        continue-on-error: true
        run: python pipelines/bev_refresh.py
      - name: GM Compliance
        continue-on-error: true
        run: python pipelines/gm_compliance_refresh.py
      - name: GC View (depends on golive/ts/scaling/hit1/task)
        continue-on-error: true
        run: python pipelines/gc_view_refresh.py
      - name: GM View (depends on gc/gm-compliance)
        continue-on-error: true
        run: python pipelines/gm_view_refresh.py
      - name: L&T View (depends on gc/golive/task/hit1)
        continue-on-error: true
        run: python pipelines/lt_refresh.py
      - name: Callback SLA adherence (card 11646)
        continue-on-error: true
        run: python pipelines/callback_sla_refresh.py
      - name: Cohort Analysis 1k-5k (card 11838)
        continue-on-error: true
        run: python pipelines/cohort_1k5k_refresh.py
      - name: Troubleshoot SOP Compliance (card 10181)
        continue-on-error: true
        run: python pipelines/ts_sop_refresh.py
      - name: Creative Generation Cost (card 12131)
        continue-on-error: true
        run: python pipelines/creative_cost_refresh.py
      - name: Seller call records (card 9688, sharded)
        continue-on-error: true
        run: python pipelines/calls_refresh.py
      - name: Hypercare Movement (card 9353)
        continue-on-error: true
        run: python pipelines/hypercare_movement_refresh.py
      - name: Revival Log (card 11911)
        continue-on-error: true
        run: python pipelines/revival_refresh.py
      - name: KAE compliance (cards 11244 + 10959)
        continue-on-error: true
        run: python pipelines/kae_refresh.py
      - name: Golive Creative Testing project tracker (card 12207)
        continue-on-error: true
        run: python pipelines/creative_test_refresh.py

      - name: Snapshot (dated, compressed archive for time-travel)
        continue-on-error: true
        run: python pipelines/snapshot.py

      - name: Commit & push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json' snapshots
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data + daily snapshot"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Nv7Bqm9rCMXGjFA018pplRCW
          VERCEL_PROJECT_ID: prj_YddUtFJTQvft3JUAArpDh9wsNr8l
        run: npx --yes vercel@latest --prod --yes --token "$VERCEL_TOKEN"
