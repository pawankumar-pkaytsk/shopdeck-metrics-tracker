name: NPS refresh (every 3 days)

# Safety refresh for Output Metrics -> NPS in case the daily run misses / source data
# lags. Runs nps_refresh (cards 10990/10992/1880), commits, deploys. Resilient + isolated.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 1 */3 * *'   # every 3rd day, 06:45 IST

permissions:
  contents: write

concurrency:
  group: nps-refresh
  cancel-in-progress: false

jobs:
  nps-refresh:
    runs-on: ubuntu-latest
    env:
      METABASE_URL: ${{ secrets.METABASE_URL }}
      METABASE_USER_EMAIL: ${{ secrets.METABASE_USER_EMAIL }}
      METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
      REPO_DIR: ${{ github.workspace }}
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install google-auth requests
      - name: NPS
        continue-on-error: true
        run: python pipelines/nps_refresh.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nps_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "NPS 3-day refresh"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi
      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Nv7Bqm9rCMXGjFA018pplRCW
          VERCEL_PROJECT_ID: prj_YddUtFJTQvft3JUAArpDh9wsNr8l
        run: npx --yes vercel@latest --prod --yes --token "$VERCEL_TOKEN"
